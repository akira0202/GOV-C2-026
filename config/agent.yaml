# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block (that shape is invisible to the registry: namespace/enabled fall
# back to defaults and name/version never resolve).
id: "GOV-C2-026"
name: "PublicProcurementSpecificationDraftAgent"
namespace: "gov-c2-026"
version: "0.1.0"
enabled: true
category: "Cat 2"
industry: "GOV"

# L1-direct (AgentBaseGraph). DocGenerationAgent is a pattern reference only
# (docs/02 Design Decision Record), not an inheritance target.
base_type: "Other"

# Entry point — single dotted import path (module.Class). AgentRegistry does
# manifest["class"].rsplit(".", 1) to get (module, class_name).
class: "src.graph.graph.PublicProcurementSpecificationDraftAgentGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — declare every secret/extra actually used.
# The Azure OpenAI connection values are resolved by src/services/llm.py through
# ctx.secrets.require() on the LLM path, so all three are declared here: the manifest states
# which secrets the deployment must provision. Declaring them does not change what the node
# does when a value cannot be resolved — that behaviour is defined in docs/02_design.md and
# is unchanged. Never place a secret value in this file or in State.
# extras names the framework extra the LLM client imports. The client is still constructed
# inside the call path, not at startup.
requires:
  secrets:
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras:
    - openai

# Runtime parameters (max_retry, timeout_seconds and the domain configuration
# surface) live in config/config.yaml, which AgentRegistry loads separately and
# passes as Graph(config=...), and which src/api/server.py loads on the
# standalone path.
